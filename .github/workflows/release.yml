name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      crate_name: ${{ steps.release.outputs.crate_name }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          version="${tag#v}"
          crate_name="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^name = / {
              gsub(/^name = "|"$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          manifest_version="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version = / {
              gsub(/^version = "|"$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          lock_version="$(awk -v crate="${crate_name}" '
            /^\[\[package\]\]$/ { in_package = 0 }
            $0 == "name = \"" crate "\"" { in_package = 1 }
            in_package && /^version = / {
              gsub(/^version = "|"$/, "")
              print
              exit
            }
          ' Cargo.lock)"

          if [[ -z "${crate_name}" || -z "${manifest_version}" || -z "${lock_version}" ]]; then
            echo "Could not read package metadata" >&2
            exit 1
          fi
          if [[ "${version}" != "${manifest_version}" || "${version}" != "${lock_version}" ]]; then
            echo "Tag, Cargo.toml, and Cargo.lock versions must match" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "Tagged commit is not reachable from origin/main" >&2
            exit 1
          fi

          {
            echo "commit=${GITHUB_SHA}"
            echo "crate_name=${crate_name}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Run release gate
        run: |
          cargo test --locked
          cargo package --locked

      - name: Extract release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          sed -i '/./,$!d' RELEASE_NOTES.md

          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "CHANGELOG.md has no release notes for ${VERSION}" >&2
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  build-linux:
    name: Build Linux release asset
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package Linux release asset
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc -vV | sed -n 's/^host: //p')"
          bundle="spek-${VERSION}-${target}"
          mkdir -p "dist/${bundle}"
          cp target/release/spek README.md LICENSE-MIT "dist/${bundle}/"
          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v6
        with:
          name: release-asset-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs:
      - validate
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes

      - name: Download Linux release asset
        uses: actions/download-artifact@v7
        with:
          name: release-asset-linux
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
          fi

  publish-crates:
    name: Publish crate
    needs:
      - validate
      - github-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Check whether version exists on crates.io
        id: crates
        env:
          CRATE_NAME: ${{ needs.validate.outputs.crate_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = f"https://crates.io/api/v1/crates/{os.environ['CRATE_NAME']}"
          try:
              with urllib.request.urlopen(url) as response:
                  versions = {item["num"] for item in json.load(response).get("versions", [])}
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("published=false")
                  sys.exit(0)
              raise

          print(f"published={'true' if os.environ['VERSION'] in versions else 'false'}")
          PY

      - name: Authenticate with crates.io
        id: auth
        if: steps.crates.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Skip crates.io publish
        if: steps.crates.outputs.published == 'true'
        run: echo "${{ needs.validate.outputs.crate_name }} ${{ needs.validate.outputs.version }} is already published"
